name: Build APK

on:
  push:
    branches: [main, "vibe/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show preinstalled SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && sdkmanager --list_installed 2>/dev/null | head -5

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 || gradle wrapper --gradle-version 8.9 --offline

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grammar-daily-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
